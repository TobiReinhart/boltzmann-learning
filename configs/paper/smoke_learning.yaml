name: paper_smoke_learning
study_type: learning
n_ip: [4]
targets:
  - {name: rewired, kind: benchmark, family: four_rewired, graph_seed: 914201}
  - {name: teacher, kind: benchmark, family: rbm_teacher, graph_seed: 914301}
sample_sizes: [64]
dataset_repetitions: 1
data_seed: 914999
initialization_seed: 1014999
initialization_std: 0.05
pair_initializations_across_training: true
pair_minibatches_across_models: true
pair_minibatches_across_training: true
pair_evaluation_states_across_models: true
device: auto
dtype: float32
weight_bound: [4.0]
models:
  - {kind: rbm, hidden: [8], n_ip: [4], comparison_group: P82}
  - {kind: 3rbm, hidden: [2], pair_mode: all, n_ip: [4], comparison_group: P82}
training_defaults:
  updates: 4
  batch_size: 16
  learning_rate: 0.002
  lr_decay_start_fraction: 0.5
  lr_final_ratio: 0.1
  optimizer: adam
  gradient_clip_norm: 10.0
  record_every: 1
training:
  - {name: rbm-cd1, algorithm: cd, pair_modes: [none], gibbs_steps: 1}
  - {name: rbm-cd2, algorithm: cd, pair_modes: [none], gibbs_steps: 2}
  - {name: all-cd1, algorithm: cd, pair_modes: [all], all_pairs_sampler: block, all_pairs_block_size: 4, gibbs_steps: 1}
  - {name: all-cd2, algorithm: cd, pair_modes: [all], all_pairs_sampler: block, all_pairs_block_size: 4, gibbs_steps: 2}
checkpoints:
  updates: [1, 2, 4]
  save_parameters: true
  ais_updates: []
evaluation:
  selection_samples: 32
  target_samples: 64
  pseudolikelihood_samples: 32
  exact_max_n: 8
  ais_enabled: false
  model_sample_chains: 8
  model_sample_burn_in: 1
  model_sample_rounds: 2
  model_sample_thinning: 1
clean_output_dir: false
output_dir: results/paper_smoke_learning
