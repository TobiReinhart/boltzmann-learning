    n_ip: [16]
    hidden: [64]
    pair_mode: cross
    comparison_group: medium
  - kind: rbm
    n_ip: [16]
    hidden: [2242]
    comparison_group: high
  - kind: 3rbm
    n_ip: [16]
    hidden: [256]
    pair_mode: cross
    comparison_group: high

  - kind: rbm
    n_ip: [32]
    hidden: [268]
    comparison_group: baseline
  - kind: 3rbm
    n_ip: [32]
    hidden: [16]
    pair_mode: cross
    comparison_group: baseline
  - kind: rbm
