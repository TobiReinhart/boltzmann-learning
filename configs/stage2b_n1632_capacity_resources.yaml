  updates: [1000, 3000, 10000, 30000, 60000, 100000]
  ais_updates: [100000]
  save_parameters: true

evaluation:
  target_samples: 32768
  exact_max_n: 0

  ais_enabled: true
  ais_particles: 512
  ais_intermediate: 5000
  ais_sweeps: 1
  ais_repetitions: 3

  model_sample_chains: 256
  model_sample_burn_in: 500
  model_sample_rounds: 40
  model_sample_thinning: 5

clean_output_dir: true
output_dir: results/stage2b_n1632_capacity_resources
