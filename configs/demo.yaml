# CPU workflow demonstration, not a converged scientific benchmark.
name: demo
study_type: learning
n_ip: [4]
targets:
  - {name: global-ip, kind: ip, beta: 1.0}
sample_sizes: [1024]
dataset_repetitions: 1
data_seed: 20261002
initialization_seed: 20261003
initialization_std: 0.05
pair_minibatches_across_models: true
pair_evaluation_states_across_models: true
device: cpu
cpu_threads: 2
dtype: float32
weight_bound: [4.0]
models:
  - {kind: rbm, hidden: [16], comparison_group: P156}
  - {kind: 3rbm, hidden: [4], pair_mode: all, comparison_group: P156}
training_defaults:
  updates: 200
  batch_size: 64
  learning_rate: 0.002
  lr_decay_start_fraction: 0.5
  lr_final_ratio: 0.1
  optimizer: adam
  gradient_clip_norm: 10.0
  record_every: 50
training:
  - {name: rbm-cd2, algorithm: cd, pair_modes: [none], gibbs_steps: 2}
  - {name: all-cd2, algorithm: cd, pair_modes: [all], all_pairs_sampler: block, all_pairs_block_size: 4, gibbs_steps: 2}
checkpoints:
  updates: [1, 50, 100, 200]
  save_parameters: true
  ais_updates: []
evaluation:
  selection_samples: 128
  target_samples: 256
  pseudolikelihood_samples: 128
  exact_max_n: 4
  ais_enabled: false
  model_sample_chains: 8
  model_sample_burn_in: 10
  model_sample_rounds: 2
  model_sample_thinning: 2
clean_output_dir: false
output_dir: results/demo
