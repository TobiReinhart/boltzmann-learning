name: stage2b_n16_cdk_ipw

n_ip: [16]
targets:
  - name: IP-w1
    kind: count_cosine
    beta: 1.0
    w: 1
  - name: IP-w3
    kind: count_cosine
    beta: 1.0
    w: 3
  - name: IP-w4
    kind: count_cosine
    beta: 1.0
    w: 4

sample_sizes: [262144]
dataset_repetitions: 2
data_seed: 314159
initialization_seed: 1729
initialization_std: 0.05

pair_initializations_across_training: true
pair_minibatches_across_models: true
pair_evaluation_states_across_models: true

device: auto
dtype: float32
weight_bound: [8.0]

models:
  - kind: rbm
    hidden: [560]
    comparison_group: m3-064
  - kind: 3rbm
    hidden: [64]
    pair_mode: cross
    comparison_group: m3-064

training_defaults:
  updates: 25000
  batch_size: 128
  learning_rate: 0.005
  optimizer: adam
  record_every: 500
  gradient_clip_norm: 10.0

training:
  - name: cd1-lr0005
    algorithm: cd
    gibbs_steps: 1
  - name: cd2-lr0005
    algorithm: cd
    gibbs_steps: 2
  - name: cd4-lr0005
    algorithm: cd
    gibbs_steps: 4
  - name: cd8-lr0005
    algorithm: cd
    gibbs_steps: 8

checkpoints:
  updates: [250, 500, 1000, 2000, 4000, 8000, 10000, 16000, 25000]
  ais_updates: []
  save_parameters: true

evaluation:
  target_samples: 16384
  pseudolikelihood_samples: 1024
  exact_max_n: 0
  ais_enabled: false

  model_sample_chains: 256
  model_sample_burn_in: 500
  model_sample_rounds: 40
  model_sample_thinning: 5

clean_output_dir: true
output_dir: results/stage2b_n16_cdk_ipw
