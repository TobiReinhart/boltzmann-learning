name: stage1_smoke

n_ip: [2]
beta: [0.5]
weight_bound: [2.0]

models:
  - kind: rbm
    hidden: [0, 1, 2]
  - kind: 3rbm
    hidden: [0, 1, 2]
    pair_mode: cross

optimization:
  restarts: 3
  random_scale: 0.25
  maxiter: 150
  ftol: 1.0e-12
  gtol: 1.0e-8
  seed: 1729

clean_output_dir: true
output_dir: results/stage1_smoke
