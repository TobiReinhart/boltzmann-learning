name: stage2b_score_regression_smoke

n_ip: [3]
targets:
  - name: IP-w1
    kind: count_cosine
    beta: 1.0
    w: 1

training_distribution: uniform
sample_sizes: [256]
dataset_repetitions: 1
data_seed: 314159
initialization_seed: 1729
initialization_std: 0.05
pair_initializations_across_training: true
pair_minibatches_across_models: true
pair_evaluation_states_across_models: true

device: cpu
dtype: float32
weight_bound: [4.0]

models:
  - kind: rbm
    hidden: [5]
    comparison_group: smoke
  - kind: 3rbm
    hidden: [2]
    pair_mode: cross
    comparison_group: smoke

training_defaults:
  updates: 20
  batch_size: 32
  learning_rate: 0.01
  optimizer: adam
  record_every: 5
  gradient_clip_norm: 10.0

training:
  - name: score-regression-lr001
    algorithm: score_regression

checkpoints:
  updates: [1, 5, 20]
  ais_updates: []
  save_parameters: true

evaluation:
  target_samples: 64
  pseudolikelihood_samples: 32
  exact_max_n: 3
  ais_enabled: false
  model_sample_chains: 8
  model_sample_burn_in: 2
  model_sample_rounds: 2
  model_sample_thinning: 1

clean_output_dir: true
output_dir: results/stage2b_score_regression_smoke
